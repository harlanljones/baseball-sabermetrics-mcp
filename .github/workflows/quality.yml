name: Quality checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile source and verification scripts
        run: python -m compileall -q src scripts
      - name: Smoke-test ingestion CLI startup
        run: python -c "from baseball_mcp.cli import build_parser; build_parser()"
      - name: Smoke-test package build
        run: python -m pip wheel --no-deps -w /tmp/wheel .
      - name: Check generated interface contract
        run: python scripts/export_mcp_spec.py --check
      - name: Run protocol, source, security, documentation, and repository checks
        run: |
          python scripts/verify_mcp.py
          python scripts/verify_lahman.py
          python scripts/verify_retrosheet.py
          python scripts/verify_catalog.py
          python scripts/verify_readonly.py
          python scripts/verify_openbiomechanics.py
          python scripts/verify_mcp_best_practices.py
          python scripts/verify_mcp_spec.py
          python scripts/verify_project_docs.py
          python scripts/verify_repo_quality.py
